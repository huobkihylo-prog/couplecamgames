<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="fav-heart-left">
      <rect x="0" y="0" width="32" height="64" />
    </clipPath>
    <clipPath id="fav-heart-right">
      <rect x="32" y="0" width="32" height="64" />
    </clipPath>
  </defs>
  <!-- Rounded coral app tile -->
  <rect width="64" height="64" rx="16" fill="#FF6B57" />

  <!-- Left tilted Polaroid frame (-8 deg) -->
  <g transform="rotate(-8 23 33)">
    <rect x="9" y="13" width="27" height="34" rx="5" fill="#FFFDF9" stroke="#FFFFFF" stroke-width="2" />
    <rect x="12.5" y="16.5" width="20" height="19.5" rx="2.5" fill="#FFE8E2" />
  </g>

  <!-- Right tilted Polaroid frame (+8 deg) -->
  <g transform="rotate(8 41 33)">
    <rect x="28" y="13" width="27" height="34" rx="5" fill="#FFFDF9" stroke="#FFFFFF" stroke-width="2" />
    <rect x="31.5" y="16.5" width="20" height="19.5" rx="2.5" fill="#EFE9FB" />
    <!-- Live red indicator dot -->
    <circle cx="49.5" cy="18" r="3.4" fill="#EF4444" stroke="#FFFDF9" stroke-width="1.6" />
  </g>

  <!-- Centered crisp split heart -->
  <path
    d="M32 40.5C32 40.5 21.6 33.8 21.6 27.1C21.6 23.4 24.5 20.8 27.7 20.8C29.8 20.8 31.2 21.9 32 23.3C32.8 21.9 34.2 20.8 36.3 20.8C39.5 20.8 42.4 23.4 42.4 27.1C42.4 33.8 32 40.5 32 40.5Z"
    fill="#FFFDF9"
    stroke="#FFFDF9"
    stroke-width="3.6"
    stroke-linejoin="round"
  />
  <path
    d="M32 39.8C32 39.8 22.3 33.5 22.3 27.2C22.3 23.8 25 21.4 27.9 21.4C29.8 21.4 31.2 22.4 32 23.7C32.8 22.4 34.2 21.4 36.1 21.4C39 21.4 41.7 23.8 41.7 27.2C41.7 33.5 32 39.8 32 39.8Z"
    fill="#FF6B57"
    clip-path="url(#fav-heart-left)"
  />
  <path
    d="M32 39.8C32 39.8 22.3 33.5 22.3 27.2C22.3 23.8 25 21.4 27.9 21.4C29.8 21.4 31.2 22.4 32 23.7C32.8 22.4 34.2 21.4 36.1 21.4C39 21.4 41.7 23.8 41.7 27.2C41.7 33.5 32 39.8 32 39.8Z"
    fill="#7C5CFC"
